<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Плитка-фон со скруглёнными углами; всё, что вылезает за неё, обрезается -->
  <defs>
    <clipPath id="tile"><rect width="32" height="32" rx="8"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="8" fill="#ece9e2"/>
  <!-- Три линии метро (Сокольническая, Замоскворецкая, Арбатско-Покровская):
       идут слева и поворачивают вверх-вправо. Верхняя поворачивает чуть раньше, нижняя — чуть позже,
       чтобы на повороте они оставались параллельными -->
  <g clip-path="url(#tile)" fill="none" stroke-width="4" stroke-linejoin="round">
    <path d="M-2 15.4 L13.9 15.4 L34 -4.7" stroke="#D92B2C"/>
    <path d="M-2 20.6 L16 20.6 L36.1 0.5" stroke="#4DBE52"/>
    <path d="M-2 25.8 L18.1 25.8 L38.2 5.7" stroke="#2C75C4"/>
  </g>
  <!-- Станция-пересадка на повороте — кольцо цвета Кольцевой линии -->
  <circle cx="16" cy="20.6" r="6.3" fill="#fff" stroke="#85412E" stroke-width="3.6"/>
</svg>
